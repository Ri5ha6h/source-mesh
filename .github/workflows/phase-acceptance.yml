name: Phase acceptance

on:
  workflow_call:
    inputs:
      phase:
        description: Phase label included in the job and evidence artifact
        required: false
        type: string
        default: current
  workflow_dispatch:
    inputs:
      phase:
        description: Phase being accepted
        required: true
        type: string
        default: '1'
  pull_request:
    branches: [main]
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: phase-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-only-gate:
    name: Phase ${{ inputs.phase || 'current' }} acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHASE_LABEL: ${{ inputs.phase || 'current' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Bootstrap the deterministic POC
        run: ./scripts/poc bootstrap

      - name: Run cumulative static, integration, and browser gates
        run: ./scripts/poc test

      - name: Run dependency, secret, filesystem, and image scans
        run: ./scripts/poc audit

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-${{ env.PHASE_LABEL }}-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down containers and volumes
        if: always()
        run: docker compose --profile infra --profile app --profile dummy --profile test --profile security down --volumes --remove-orphans
